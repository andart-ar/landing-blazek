services:
  - type: web
    name: landing-blazek
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: node ./dist/server/entry.mjs
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_AUDIENCE_ID
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
